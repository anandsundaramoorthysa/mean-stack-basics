<div ng-app="shopApp" ng-controller="ShopController">
  <ul>
    <li ng-repeat="item in items | orderBy:'price'">{{ item.name | uppercase }} - {{ item.price | currency }}</li>
  </ul>

  <form name="regForm">
    <input name="email" type="email" ng-model="email" placeholder="Email" required>
    <button ng-disabled="regForm.$invalid">Register</button>
  </form>
</div>

<script>
  angular.module('shopApp', []).controller('ShopController', function ($scope) {
    $scope.items = [
      { name: 'Notebook', price: 120 },
      { name: 'Pen', price: 10 }
    ];
  });
</script>
