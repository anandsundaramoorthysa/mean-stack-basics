<div ng-app="shopApp" ng-controller="ShopController">
  <ul>
    <li ng-repeat="item in items" ng-class="{ out: !item.inStock }">{{ item.name }}</li>
  </ul>
  <p ng-if="items.length === 0">No items</p>
  <button ng-click="toggle()">Toggle</button>
</div>

<script>
  angular.module('shopApp', []).controller('ShopController', function ($scope) {
    $scope.items = [
      { name: 'Pen', inStock: true },
      { name: 'Ruler', inStock: false }
    ];
    $scope.show = true;
    $scope.toggle = function () {
      $scope.show = !$scope.show;
    };
  });
</script>
