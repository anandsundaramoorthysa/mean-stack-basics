<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Feedback</title>
  </head>
  <body>
    <h1>Feedback</h1>
    <form action="/feedback" method="post">
      <fieldset>
        <legend>Level</legend>
        <input type="radio" id="l1" name="level" value="beginner">
        <label for="l1">Beginner</label>
        <input type="radio" id="l2" name="level" value="intermediate">
        <label for="l2">Intermediate</label>
        <input type="radio" id="l3" name="level" value="advanced">
        <label for="l3">Advanced</label>
      </fieldset>
      <p>
        <input type="checkbox" id="news" name="newsletter">
        <label for="news">Send me news</label>
      </p>
      <p>
        <label for="course">Course</label>
        <select id="course" name="course">
          <option value="cs">Computer Science</option>
          <option value="ee">Electrical</option>
          <option value="me">Mechanical</option>
        </select>
      </p>
      <p>
        <label for="comments">Comments</label><br>
        <textarea id="comments" name="comments" rows="4"></textarea>
      </p>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
