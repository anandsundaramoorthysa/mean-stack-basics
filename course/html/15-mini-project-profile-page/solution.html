<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My profile</title>
  </head>
  <body>
    <header>
      <h1>Asha Kumar</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <main>
      <section id="about">
        <h2>About</h2>
        <p>I am a first-year student who enjoys <strong>building web pages</strong>.</p>
        <img src="me.jpg" alt="Asha smiling at the camera" width="200" height="200">
        <p><a href="https://developer.mozilla.org" target="_blank" rel="noopener">Where I learn</a></p>
      </section>
      <section id="skills">
        <h2>Skills</h2>
        <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </section>
      <section id="projects">
        <h2>Projects</h2>
        <table>
          <caption>My projects</caption>
          <thead>
            <tr><th scope="col">Project</th><th scope="col">Year</th></tr>
          </thead>
          <tbody>
            <tr><td>Class timetable</td><td>2026</td></tr>
            <tr><td>Recipe page</td><td>2026</td></tr>
          </tbody>
        </table>
      </section>
      <section id="contact">
        <h2>Contact</h2>
        <form action="/contact" method="post">
          <p><label for="email">Email</label> <input id="email" name="email" type="email" required></p>
          <p><label for="message">Message</label><br><textarea id="message" name="message" rows="4"></textarea></p>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Asha Kumar</p>
    </footer>
  </body>
</html>
