<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sign up</title>
  </head>
  <body>
    <h1>Sign up</h1>
    <form action="/signup" method="post">
      <p><label for="username">Username</label> <input id="username" name="username" type="text" required minlength="3"></p>
      <p><label for="email">Email</label> <input id="email" name="email" type="email" required placeholder="you@example.com"></p>
      <p><label for="age">Age</label> <input id="age" name="age" type="number" min="18" max="60"></p>
      <p><label for="pin">PIN</label> <input id="pin" name="pin" type="text" required pattern="[0-9]{4}" title="Four digits"></p>
      <button type="submit">Join</button>
    </form>
  </body>
</html>
