<!DOCTYPE html>
<html>
  <head>
    <title>Inheritance and variables</title>
    <style>
      :root {
        --brand: #0057b8;
        --space: 16px;
      }
      body {
        color: darkslategray;
      }
      h1 {
        color: var(--brand);
      }
      .btn {
        background-color: var(--brand);
        padding: var(--space);
      }
    </style>
  </head>
  <body>
    <h1>Welcome</h1>
    <p>This paragraph has no rule of its own.</p>
    <a class="btn" href="#">Enrol now</a>
  </body>
</html>
