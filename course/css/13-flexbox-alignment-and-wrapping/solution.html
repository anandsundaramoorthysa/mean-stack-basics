<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox alignment</title>
    <style>
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>My Site</strong>
      <a href="#">Home</a>
      <a href="#">Courses</a>
    </div>
    <div class="tags">
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
      <span>Node.js</span>
      <span>Express</span>
      <span>MongoDB</span>
      <span>Angular</span>
    </div>
  </body>
</html>
