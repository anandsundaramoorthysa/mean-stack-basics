<!DOCTYPE html>
<html>
  <head>
    <title>Selectors</title>
    <style>
      h1, h2 {
        color: navy;
      }
      .note {
        color: orange;
      }
      #warning {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Campus Notice Board</h1>
    <h2>Today</h2>
    <p class="note">Library opens at 8 am.</p>
    <p class="note">Lab 2 is booked for exams.</p>
    <p>Canteen menu is on the wall.</p>
    <p id="warning">Parking is closed after 6 pm.</p>
  </body>
</html>
