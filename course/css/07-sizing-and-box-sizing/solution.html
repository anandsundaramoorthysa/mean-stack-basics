<!DOCTYPE html>
<html>
  <head>
    <title>Sizing</title>
    <style>
      .panel {
        box-sizing: border-box;
        width: 300px;
        max-width: 100%;
        height: 120px;
        padding: 20px;
      }
      .photo {
        width: 100%;
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="panel">A fixed-size panel</div>
    <div class="photo">Photo placeholder</div>
  </body>
</html>
