<!DOCTYPE html>
<html>
  <head>
    <title>Colors and units</title>
    <style>
      .parent {
        font-size: 20px;
      }
      .hex { color: #ff6600; }
      .rgb { color: rgb(0, 128, 0); }
      .hsl { color: hsl(240, 100%, 50%); }
      .em { font-size: 2em; }
      .rem { font-size: 2rem; }
    </style>
  </head>
  <body>
    <p class="hex">Hex colour</p>
    <p class="rgb">RGB colour</p>
    <p class="hsl">HSL colour</p>
    <div class="parent">
      <p class="em">Em size</p>
    </div>
    <p class="rem">Rem size</p>
  </body>
</html>
