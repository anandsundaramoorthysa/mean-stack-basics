<!DOCTYPE html>
<html>
  <head>
    <title>Grid placement</title>
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .grid div, .page > * {
        background-color: #e8eef7;
        padding: 10px;
      }
      .feature {
        grid-column: span 2;
      }
      .page {
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-areas:
          "header header"
          "sidebar main";
      }
      .page header {
        grid-area: header;
      }
      .sidebar {
        grid-area: sidebar;
      }
      .main {
        grid-area: main;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="feature">Feature</div>
      <div>B</div>
      <div>C</div>
      <div>D</div>
      <div>E</div>
    </div>
    <div class="page">
      <header>Header</header>
      <div class="sidebar">Sidebar</div>
      <div class="main">Main content</div>
    </div>
  </body>
</html>
