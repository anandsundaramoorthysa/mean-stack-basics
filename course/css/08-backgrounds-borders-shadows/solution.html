<!DOCTYPE html>
<html>
  <head>
    <title>Backgrounds, borders and shadows</title>
    <style>
      .card, .avatar {
        margin: 16px;
      }
      .card {
        padding: 16px;
        background-color: whitesmoke;
        border: 1px solid #ccc;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }
      .avatar {
        width: 80px;
        height: 80px;
        background-color: steelblue;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p>Anita, first-year student</p>
    </div>
    <div class="avatar"></div>
  </body>
</html>
