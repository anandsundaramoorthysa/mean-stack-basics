<!DOCTYPE html>
<html>
  <head>
    <title>Text and fonts</title>
    <style>
      h1 {
        font-size: 32px;
        text-align: center;
      }
      p {
        font-family: Arial, sans-serif;
        font-size: 18px;
        line-height: 1.5;
      }
      .lead {
        font-weight: bold;
      }
      a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Study Tips</h1>
    <p class="lead">Start with the topics you find hardest.</p>
    <p>Short sessions with breaks work better than one long night. Read more on the <a href="#">exam page</a>.</p>
  </body>
</html>
