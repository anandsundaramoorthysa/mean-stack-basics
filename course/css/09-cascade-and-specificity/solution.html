<!DOCTYPE html>
<html>
  <head>
    <title>Cascade</title>
    <style>
      p {
        color: blue;
      }
      .note {
        color: green;
      }
      .late {
        background-color: yellow;
      }
      #special {
        color: red;
      }
      .late {
        background-color: pink;
      }
    </style>
  </head>
  <body>
    <p class="note">A normal note.</p>
    <p class="note" id="special">A special note.</p>
    <p class="late">A late paragraph.</p>
  </body>
</html>
